<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>地獄拖拉機大富翁</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f8ff; }
        #game-board { position: relative; width: 600px; height: 450px; margin: 20px auto; background: #e8f5e9; border: 6px solid #4caf50; }
        .space { position: absolute; width: 70px; height: 70px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; }
        .player { position: absolute; width: 40px; height: 40px; font-size: 30px; transition: all 0.4s; z-index: 10; }
    </style>
</head>
<body>
    <div id="login-screen">
        <button onclick="joinGame('👼')">選👼</button>
        <button onclick="joinGame('🦊')">選🦊</button>
        <button onclick="joinGame('👻')">選👻</button>
    </div>
    <div id="game-container" style="display:none;">
        <div id="game-board"></div>
        <button id="roll-btn" onclick="roll()" disabled>擲骰子</button>
        <div id="dice-display"></div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const board = [
            {x: 50, y: 50}, {x: 150, y: 50}, {x: 250, y: 50}, {x: 350, y: 50}, {x: 450, y: 50},
            {x: 450, y: 150}, {x: 450, y: 250}, {x: 450, y: 350}, {x: 350, y: 350},
            {x: 250, y: 350}, {x: 150, y: 350}, {x: 50, y: 350}, {x: 50, y: 250}, {x: 50, y: 150}
        ];
        
        // 渲染地圖
        board.forEach((pos, i) => {
            const div = document.createElement('div');
            div.className = 'space';
            div.style.left = pos.x + 'px'; div.style.top = pos.y + 'px';
            div.innerText = i;
            document.getElementById('game-board').appendChild(div);
        });

        function joinGame(avatar) {
            socket.emit('joinGame', avatar);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
        }

        function roll() { socket.emit('rollDice'); }

        socket.on('turnUpdate', (data) => {
            document.getElementById('roll-btn').disabled = (data.currentTurnId !== socket.id);
        });

        socket.on('diceResult', (data) => {
            document.getElementById('dice-display').innerText = "擲出了 " + data.steps;
            updatePlayers(data.player);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') socket.emit('playerMove', 1); // 簡化邏輯供測試
        });

        function updatePlayers(p) {
            let el = document.getElementById(p.id) || document.createElement('div');
            el.id = p.id; el.className = 'player'; el.innerText = p.avatar;
            el.style.left = board[p.position].x + 'px'; el.style.top = board[p.position].y + 'px';
            document.getElementById('game-board').appendChild(el);
        }
    </script>
</body>
</html>
