<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地獄拖拉機大富翁 - 連線測試</title>
    <style>
        body { text-align: center; font-family: 'Segoe UI', Tahoma, sans-serif; background: #e0f7fa; margin-top: 30px;}
        canvas { background: white; border: 3px solid #b2ebf2; border-radius: 15px; cursor: pointer; box-shadow: 0 8px 16px rgba(0,0,0,0.1);}
        h2 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>
    <h2>🎲 多人連線測試中 🎲</h2>
    <p>點擊畫布任何地方，移動你的專屬圓點！別人也會同步看到喔！</p>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let players = {};

        // 接收伺服器資料更新畫面
        socket.on('currentPlayers', (serverPlayers) => { players = serverPlayers; draw(); });
        socket.on('newPlayer', (playerInfo) => { players[playerInfo.id] = playerInfo.player; draw(); });
        socket.on('playerMoved', (playerInfo) => { players[playerInfo.id] = playerInfo.player; draw(); });
        socket.on('playerDisconnected', (playerId) => { delete players[playerId]; draw(); });

        // 點擊畫布移動圓點
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            socket.emit('playerMovement', { x, y });
        });

        // 繪製所有玩家
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let id in players) {
                ctx.fillStyle = players[id].color;
                ctx.beginPath();
                ctx.arc(players[id].x, players[id].y, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }
    </script>
</body>
</html>
