<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地獄拖拉機大富翁 - 瑪利歐派對版</title>
    <style>
        body { text-align: center; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f8ff; margin-top: 20px;}
        canvas { background: #e8f5e9; border: 4px solid #4caf50; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.2);}
        .ui-container { margin-top: 15px; }
        button { font-size: 20px; padding: 10px 20px; cursor: pointer; background: #ff9800; color: white; border: none; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;}
        button:hover { background: #e68a00; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        #dice-display { font-size: 24px; font-weight: bold; color: #d32f2f; margin-left: 15px; }
    </style>
</head>
<body>
    <h2>🌟 瑪利歐派對大富翁 🌟</h2>
    <canvas id="gameCanvas" width="600" height="450"></canvas>
    
    <div class="ui-container">
        <button onclick="roll()">🎲 擲骰子</button>
        <span id="dice-display">等待擲骰...</span>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const diceDisplay = document.getElementById('dice-display');
        let players = {};

        // 繪製地圖：環狀長方形的 14 個格子座標
        const board = [
            {x: 50, y: 50, color: '#ffeb3b', text: '起點'},
            {x: 150, y: 50, color: '#64b5f6', text: ''},
            {x: 250, y: 50, color: '#ce93d8', text: '？'},
            {x: 350, y: 50, color: '#64b5f6', text: ''},
            {x: 450, y: 50, color: '#e57373', text: '！'},
            {x: 450, y: 150, color: '#64b5f6', text: ''},
            {x: 450, y: 250, color: '#ce93d8', text: '？'},
            {x: 450, y: 350, color: '#64b5f6', text: ''},
            {x: 350, y: 350, color: '#e57373', text: '！'},
            {x: 250, y: 350, color: '#64b5f6', text: ''},
            {x: 150, y: 350, color: '#ce93d8', text: '？'},
            {x: 50, y: 350, color: '#64b5f6', text: ''},
            {x: 50, y: 250, color: '#e57373', text: '！'},
            {x: 50, y: 150, color: '#64b5f6', text: ''}
        ];

        socket.on('currentPlayers', (serverPlayers) => { players = serverPlayers; draw(); });
        socket.on('newPlayer', (playerInfo) => { players[playerInfo.id] = playerInfo; draw(); });
        socket.on('playerDisconnected', (playerId) => { delete players[playerId]; draw(); });
        
        // 接收有人擲骰子的結果
        socket.on('diceResult', (data) => {
            players[data.id] = data.player;
            if(data.id === socket.id) {
                diceDisplay.innerText = `你擲出了 ${data.steps} 步！`;
            } else {
                diceDisplay.innerText = `${players[data.id].avatar} 擲出了 ${data.steps} 步！`;
            }
            draw();
        });

        // 點擊按鈕觸發擲骰子
        function roll() {
            socket.emit('rollDice');
        }

        // 重新繪製遊戲畫面
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. 畫出地圖方塊
            board.forEach((space) => {
                ctx.fillStyle = space.color;
                ctx.fillRect(space.x, space.y, 80, 80);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(space.x, space.y, 80, 80);
                
                ctx.fillStyle = '#333';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(space.text, space.x + 40, space.y + 40);
            });

            // 2. 畫出排行榜與玩家
            let scoreY = 30;
            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('🏆 收集榜', 500, scoreY);
            
            for (let id in players) {
                const p = players[id];
                const space = board[p.position];
                
                // 畫出玩家角色 (加入微小偏移，避免大家都疊在一起)
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                const offset = (id.charCodeAt(0) % 5) * 5; 
                ctx.fillText(p.avatar, space.x + 40 + offset, space.y + 40 + offset);

                // 畫出排行榜上的分數
                scoreY += 25;
                ctx.fillText(`${p.avatar} : ${p.coins} 💰`, 500, scoreY);
            }
        }
    </script>
</body>
</html>
